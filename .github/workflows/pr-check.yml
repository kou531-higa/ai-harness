name: pr-check

# ai-harness 自身にも、配布するのと同じ PR サイズの検査をかける

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR の変更行数（上限 400 行）
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 templates/core/scripts/check_pr_size.py --base "origin/${BASE_REF}" --labels "$LABELS"
