[project]
name = "ai-harness"
version = "0.2.0"
description = "AIは作業し、人は判断する。Claude Code をチームの開発工程に組み込むハーネス"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
harness = "ai_harness.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_harness"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "ai_harness/templates"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py38"  # フックとスクリプトは導入先の古い Python でも動かす

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # typing.List などを 3.8 互換のため許す

[tool.ruff.lint.per-file-ignores]
# 診断の基準は、1行に1つ並べて表のように読めるようにしている
"src/ai_harness/doctor.py" = ["E501"]
"tests/test_doctor.py" = ["E501"]
"tests/test_stats.py" = ["E501"]
"src/ai_harness/stats.py" = ["E501"]
