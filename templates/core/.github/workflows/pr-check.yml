name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]  # edited：本文の「関係する DEC」を見直す

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR の変更行数（本体 400 行・テスト 800 行）
        env:
          # ラベル名は env 経由で渡す（スクリプトに直接埋め込まない）
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
          # 上限はリポジトリの変数（Settings → Variables）で変えられる。空なら既定（400・800）
          HARNESS_PR_MAX: ${{ vars.HARNESS_PR_MAX }}
          HARNESS_PR_MAX_TESTS: ${{ vars.HARNESS_PR_MAX_TESTS }}
        run: python3 scripts/check_pr_size.py --base "origin/${BASE_REF}" --labels "$LABELS"
      - name: 衝突の印が残っていない（<<<<<<< と >>>>>>> の行）
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- .; then
            echo "衝突の印が残っています。衝突を直してから push してください"; exit 1
          fi

  review-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: AI レビューの割り振りと未カバー（重要な所が未カバーなら止める）
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/review_route.py --base "origin/${BASE_REF}" --strict | tee -a "$GITHUB_STEP_SUMMARY"

  forbidden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 禁止パターン（追加した行だけ）
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_forbidden.py --base "origin/${BASE_REF}"

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 仕様の未確定と書式
        run: |
          if [ -d docs/specs ]; then
            python3 scripts/check_undecided.py docs/specs --require approved
          else
            echo "docs/specs がないので飛ばします"
          fi
      - name: 仕様どうしの食い違い（新しく増えたものだけで止める）
        run: |
          if [ -f docs/specs/functions.md ]; then
            python3 scripts/check_spec_consistency.py docs/specs --baseline docs/specs/consistency-baseline.json
          else
            echo "機能一覧（docs/specs/functions.md）がないので飛ばします"
          fi
      - name: 参照している DEC の判断記録がある（PR の本文と仕様）
        env:
          # PR の本文は env 経由で渡す（スクリプトに直接埋め込まない）
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          targets=""
          [ -d docs/specs ] && targets="docs/specs"
          [ -d docs/decisions ] && targets="$targets docs/decisions"
          python3 scripts/check_dec_refs.py --body-file "$RUNNER_TEMP/pr-body.md" $targets
      - name: 未決事項台帳が仕様と合っている
        run: |
          if [ -f docs/decisions/undecided.md ]; then
            python3 scripts/undecided_ledger.py --check
          else
            echo "未決事項台帳（docs/decisions/undecided.md）がないので飛ばします"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # プロジェクトに合わせてセットアップを足す（例：astral-sh/setup-uv、actions/setup-node）
      - name: make check（lint・型・テスト・差分カバレッジ）
        run: make check
